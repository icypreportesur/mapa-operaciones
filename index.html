<!DOCTYPE html><html><head><meta charset='utf-8'><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script></head><body><div id='map' style='width:100%;height:100vh;'></div><script>var gSateliteHibrido = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'], attribution: 'Google Maps'});var gNormal = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'], attribution: 'Google Maps'});var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution: 'OSM'});var map = L.map('map', {center: [-14.05, -75.73], zoom: 9, layers: [gSateliteHibrido]});var baseMaps = {'Google Satelital': gSateliteHibrido, 'Google Normal': gNormal, 'Mapa Claro (OSM)': osm};L.control.layers(baseMaps).addTo(map);</script></body></html>
